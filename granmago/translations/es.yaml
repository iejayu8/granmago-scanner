configuration:
  log_level:
    name: Nivel de log
    description: Detalle de los mensajes del complemento.
  risk_pct:
    name: Riesgo %
    description: Porcentaje del balance de paper que arriesga cada operación.
  leverage:
    name: Apalancamiento
    description: Se anota en la operación. El tamaño sale del riesgo y de la distancia al stop.
  initial_balance:
    name: Balance inicial
    description: Balance de paper al resetear desde la página.
  scan_seconds:
    name: Segundos entre escaneos
    description: Intervalo del escaneo completo. Con una posición abierta el precio se mira cada 20 segundos y el escaneo sigue.
  trailing_enabled:
    name: Trailing stop
    description: Si está activo, una operación en beneficio pasa del stop y el objetivo fijos a un stop dinámico.
  trailing_activation_pct:
    name: Activación del trailing %
    description: Beneficio no realizado, en porcentaje del nocional, para que el trailing tome el control.
  trailing_distance:
    name: Distancia del trailing
    description: Distancia del trailing como fracción del riesgo inicial (entrada al stop original).
