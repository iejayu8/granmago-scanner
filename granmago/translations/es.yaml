configuration:
  log_level:
    name: Nivel de log
    description: Detalle de los mensajes del complemento.
  initial_balance:
    name: Balance inicial
    description: Balance de paper al resetear desde la página.
  risk_pct:
    name: Riesgo %
    description: Porcentaje del balance de paper que arriesga cada operación. El defecto es 1.
  leverage:
    name: Apalancamiento
    description: Limita la suma de nocionales a balance por apalancamiento. El tamaño sale del riesgo y del stop. El defecto es 3.
  max_positions:
    name: Máximo de posiciones
    description: Cuántas operaciones pueden estar abiertas a la vez, cada una en una moneda distinta. De 1 a 12. El defecto es 3.
  fee_pct_per_side:
    name: Comisión % por lado
    description: Comisión taker en la entrada y en la salida, en porcentaje del nocional. El defecto es 0,06, cerca del taker de Blofin.
  slippage_pct_per_side:
    name: Slippage % por lado
    description: Empeora el precio de entrada y de salida, en porcentaje. El defecto es 0,02.
  trading_mode:
    name: Modo de trading
    description: paper (defecto, simulado), demo (órdenes en una cuenta Blofin Demo Trading con las claves de abajo) o live (bloqueado en esta versión; el complemento se niega a operar).
  blofin_api_key:
    name: API key de Blofin
    description: API key de Demo Trading. Solo permiso de trading, sin retirada y restringida por IP si se puede. Nunca aparece en logs ni en la página.
  blofin_api_secret:
    name: Secret de Blofin
    description: Secret de la API key. Nunca aparece en logs ni en la página.
  blofin_api_passphrase:
    name: Passphrase de Blofin
    description: Passphrase elegida al crear la key. Nunca aparece en logs ni en la página.
  control_token:
    name: Token de control
    description: Opcional. Permite que herramientas fuera del panel de HA usen los endpoints de control (arrancar, parar, kill switch) con la cabecera X-GranMago-Token. Sin él, solo el panel de HA controla el bot.
  kill_switch:
    name: Kill switch
    description: Activado, el bot no abre posiciones nuevas. Las abiertas mantienen su SL/TP. Para cerrarlas también usa POST /api/kill_switch con closeAll.
  pairs:
    name: Pares
    description: Swaps USDT que se escanean, un símbolo por línea (por ejemplo BTC-USDT). El defecto son los 28 pares de la monitorización. Una lista vacía usa esos 28 y sustituye la lista guardada en el estado. Se usan como máximo 40. Una posición abierta en un par que quites se sigue vigilando hasta que cierre.
