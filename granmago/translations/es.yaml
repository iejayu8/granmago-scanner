configuration:
  log_level:
    name: Nivel de log
    description: Detalle de los mensajes del complemento.
  initial_balance:
    name: Balance inicial
    description: Balance de paper al resetear desde la página.
  risk_pct:
    name: Riesgo %
    description: Porcentaje del balance de paper que arriesga cada operación. El defecto es 1.
  leverage:
    name: Apalancamiento
    description: Limita la suma de nocionales a balance por apalancamiento. El tamaño sale del riesgo y del stop. El defecto es 3.
  max_positions:
    name: Máximo de posiciones
    description: Cuántas operaciones pueden estar abiertas a la vez, cada una en una moneda distinta. De 1 a 12. El defecto es 3.
  fee_pct_per_side:
    name: Comisión % por lado
    description: Comisión taker en la entrada y en la salida, en porcentaje del nocional. El defecto es 0,06, cerca del taker de Blofin.
  slippage_pct_per_side:
    name: Slippage % por lado
    description: Empeora el precio de entrada y de salida, en porcentaje. El defecto es 0,02.
  pairs:
    name: Pares
    description: Swaps USDT que se escanean, un símbolo por línea (por ejemplo BTC-USDT). El defecto son los 28 pares de la monitorización. Una lista vacía usa esos 28 y sustituye la lista guardada en el estado. Se usan como máximo 40. Una posición abierta en un par que quites se sigue vigilando hasta que cierre.
