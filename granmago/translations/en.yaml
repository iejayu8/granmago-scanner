configuration:
  log_level:
    name: Log level
    description: How much the add-on writes to the log.
  risk_pct:
    name: Risk %
    description: Percent of the paper balance risked on each trade.
  leverage:
    name: Leverage
    description: Stored on the trade. Size comes from risk and stop distance.
  initial_balance:
    name: Initial balance
    description: Paper balance used when you reset from the page.
  scan_seconds:
    name: Seconds between scans
    description: Full scan interval. An open position is still checked every 20 seconds and does not stop the scan.
  max_hold_hours:
    name: Max hold hours
    description: Close the open paper position at market after this many hours. 0 disables the limit.
