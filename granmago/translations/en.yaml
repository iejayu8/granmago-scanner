configuration:
  log_level:
    name: Log level
    description: How much the add-on writes to the log.
  initial_balance:
    name: Initial balance
    description: Paper balance used when you reset from the page.
  risk_pct:
    name: Risk %
    description: Percent of the paper balance risked on each trade. Default is 1.
  leverage:
    name: Leverage
    description: Caps total notional at balance times leverage. Size still comes from risk and the stop. Default is 3.
  max_positions:
    name: Max positions
    description: How many trades can be open at once, each on a different coin. From 1 to 12. Default is 3.
  fee_pct_per_side:
    name: Fee % per side
    description: Taker fee charged on entry and on exit, in percent of notional. Default is 0.06, about the Blofin taker.
  slippage_pct_per_side:
    name: Slippage % per side
    description: Adverse fill, in percent, applied to the entry and the exit. Default is 0.02.
  trading_mode:
    name: Trading mode
    description: paper (default, simulated), demo (orders on a Blofin Demo Trading account with the keys below) or live (blocked in this version, the add-on refuses to trade).
  blofin_api_key:
    name: Blofin API key
    description: Demo Trading API key. Trade permission only, no withdrawal, IP-restricted if possible. Never shown in logs or in the page.
  blofin_api_secret:
    name: Blofin API secret
    description: Secret of the API key. Never shown in logs or in the page.
  blofin_api_passphrase:
    name: Blofin API passphrase
    description: Passphrase chosen when the key was created. Never shown in logs or in the page.
  control_token:
    name: Control token
    description: Optional. Lets tools outside the HA panel call the control endpoints (start, stop, kill switch) with the X-GranMago-Token header. Without it only the HA panel can control the bot.
  kill_switch:
    name: Kill switch
    description: When on, the bot opens no new positions. Open positions keep their SL/TP. To also close them use the kill switch button or POST /api/kill_switch with closeAll.
  pairs:
    name: Pairs
    description: USDT swaps to scan, one symbol per entry (for example BTC-USDT). Default is the 28-pair monitoring book. An empty list uses those 28 and replaces a list saved in the add-on state. At most 40 symbols are used. An open position on a pair you remove stays monitored until it closes.
