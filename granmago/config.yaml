name: GranMago Scanner
version: "1.5.0"
slug: granmago
description: Paper trading del scanner GranMago. El bot corre en el servidor aunque cierres la página.
url: https://github.com/iejayu8/granmago-scanner
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
boot: auto
ingress: true
ingress_port: 8787
panel_icon: mdi:crystal-ball
panel_title: GranMago
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Interfaz web del scanner
options:
  log_level: info
  risk_pct: 2
  leverage: 3
  initial_balance: 10000
  scan_seconds: 90
  trailing_enabled: true
  trailing_activation_pct: 1.0
  trailing_distance: 0.5
  entry_threshold: 100
  max_positions: 5
  fee_pct_per_side: 0
  slippage_pct_per_side: 0
  take_profit_r: 1.7
  partial_tp_r: 0
  partial_tp_fraction: 0.5
  partial_move_breakeven: true
  stop_mode: swing
  stop_atr_period: 14
  stop_atr_mult: 2
  trailing_activation_r: 0
  trailing_keep_tp: false
  pair_cooldown_minutes: 0
  max_same_direction_risk_r: 0
  regime_filter: off
  regime_adx_min: 20
  regime_er_min: 0.2
  strategy: scanner
  granmago_variant: a
  granmago_max_adds: 0
  granmago_momentum_exit: true
  granmago_max_hold_bars: 15
  granmago_breakeven_r: 0
  granmago_min_rr: 0
  granmago_stop_pad_pct: 0.3
  granmago_style: strict
  granmago_setups: both
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  risk_pct: float
  leverage: int
  initial_balance: int
  scan_seconds: int
  trailing_enabled: bool
  trailing_activation_pct: float
  trailing_distance: float
  entry_threshold: int(0,100)
  max_positions: int(1,12)
  fee_pct_per_side: float
  slippage_pct_per_side: float
  take_profit_r: float
  partial_tp_r: float
  partial_tp_fraction: float
  partial_move_breakeven: bool
  stop_mode: list(swing|atr)
  stop_atr_period: int(2,100)
  stop_atr_mult: float
  trailing_activation_r: float
  trailing_keep_tp: bool
  pair_cooldown_minutes: int(0,10080)
  max_same_direction_risk_r: float
  regime_filter: list(off|slope|adx|er|slope_adx|slope_er)
  regime_adx_min: float
  regime_er_min: float
  strategy: list(scanner|granmago)
  granmago_variant: list(a|b)
  granmago_max_adds: int(0,2)
  granmago_momentum_exit: bool
  granmago_max_hold_bars: int(0,40)
  granmago_breakeven_r: float
  granmago_min_rr: float
  granmago_stop_pad_pct: float
  granmago_style: list(strict|sweep)
  granmago_setups: list(both|sweep|pullback)
