name: GranMago Scanner
version: "1.7.0"
slug: granmago
description: Scanner GranMago. Paper por defecto; demo de Blofin opcional (modo real bloqueado). El bot corre en el servidor aunque cierres la página.
url: https://github.com/iejayu8/granmago-scanner
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
boot: auto
ingress: true
ingress_port: 8787
panel_icon: mdi:crystal-ball
panel_title: GranMago
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Interfaz web del scanner
options:
  log_level: info
  initial_balance: 10000
  risk_pct: 1
  leverage: 3
  max_positions: 3
  fee_pct_per_side: 0.06
  slippage_pct_per_side: 0.02
  trading_mode: paper
  blofin_api_key: ""
  blofin_api_secret: ""
  blofin_api_passphrase: ""
  control_token: ""
  kill_switch: false
  pairs:
    - BTC-USDT
    - ETH-USDT
    - SOL-USDT
    - XRP-USDT
    - BNB-USDT
    - ADA-USDT
    - DOGE-USDT
    - AVAX-USDT
    - LINK-USDT
    - DOT-USDT
    - LTC-USDT
    - BCH-USDT
    - ZEC-USDT
    - PEPE-USDT
    - 1000BONK-USDT
    - NEAR-USDT
    - XMR-USDT
    - INJ-USDT
    - SUI-USDT
    - TAO-USDT
    - IOST-USDT
    - XLM-USDT
    - TRX-USDT
    - HBAR-USDT
    - ENA-USDT
    - WLD-USDT
    - AAVE-USDT
    - QNT-USDT
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  initial_balance: int
  risk_pct: float
  leverage: int
  max_positions: int(1,12)
  fee_pct_per_side: float
  slippage_pct_per_side: float
  trading_mode: list(paper|demo|live)
  blofin_api_key: password?
  blofin_api_secret: password?
  blofin_api_passphrase: password?
  control_token: password?
  kill_switch: bool
  pairs:
    - match(^[A-Za-z0-9]+-USDT$)
